[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard-ai"
version = "0.2.0"
description = "Read-only CSV quality checks and reproducible imputation impact experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
]
dev = [
    "pytest>=8",
]

[project.scripts]
dataguard = "dataguard.cli:main"

[project.urls]
Repository = "https://github.com/JaberAhmad555/DataGuard-AI"
Issues = "https://github.com/JaberAhmad555/DataGuard-AI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"